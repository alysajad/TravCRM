services:
  - type: web
    name: travcrm-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build --workspace @travcrm/api
    startCommand: npm run start --workspace @travcrm/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://travcrm-ten.vercel.app
      - key: PUBLIC_APP_URL
        value: https://travcrm-ten.vercel.app
